Adjust="spacing">AI SAAS</text><rect x="536.8" y="92" width="136.8" height="26" rx="3" fill="#050B07" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="545.8" y="108.85" font-size="11" class="t" xml:space="preserve" textLength="118.8" lengthAdjust="spacing">CLOUD ARCHITECTURE</text><rect x="681.6" y="92" width="163.2" height="26" rx="3" fill="#050B07" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="690.6" y="108.85" font-size="11" class="t" xml:space="preserve" textLength="145.2" lengthAdjust="spacing">INTELLIGENT AUTOMATION</text><rect x="852.8" y="92" width="90.6" height="26" rx="3" fill="#050B07" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="861.8" y="108.85" font-size="11" class="t" xml:space="preserve" textLength="72.6" lengthAdjust="spacing">AI SECURITY</text><line x1="24" y1="142" x2="976" y2="142" stroke="#0B5F27" stroke-width="1" opacity="0.6"/><text x="500" y="170" font-size="15" class="t b" xml:space="preserve" text-anchor="middle" letter-spacing="2.4" filter="url(#glow-soft)">BUILD SYSTEMS  /  SOLVE PROBLEMS  /  CREATE IMPACT</text><text x="396.45" y="204" font-size="12.5" class="g" xml:space="preserve" letter-spacing="1.6">SYSTEM STATUS: ONLINE</text><rect x="591.55" y="194" width="7" height="12" fill="#00FF41" class="cursor"/></svg>
