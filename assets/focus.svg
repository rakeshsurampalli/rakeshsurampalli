<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 468" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Current focus: AI engineering, agentic systems, retrieval, AI security, backend and platform">
  <title>Current focus: AI engineering, agentic systems, retrieval, AI security, backend and platform</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00FF41" opacity="0.03"/>
