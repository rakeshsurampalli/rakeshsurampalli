<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1000 252" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Engineering philosophy: solve, design, measure, improve">
  <title>Engineering philosophy: solve, design, measure, improve</title>
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00FF41" opacity="0.03"/>
    </pattern>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#00FF41" stroke-width="0.5" opacity="0.05"/>
    </pattern>
  </defs>
  <style>
    text { font-family: "JetBrains Mono","Fira Code","IBM Plex Mono","DejaVu Sans Mono","Courier New",monospace; white-space: pre; }
    .t { fill: #D7FFE0; }
    .t2 { fill: #8BB596; }
    .g { fill: #00FF41; }
    .g2 { fill: #00C832; }
    .gd { fill: #008F2F; }
    .m { fill: #548C61; }
    .b { font-weight: 700; }
    @keyframes fin { from { opacity: 0; } to { opacity: 1; } }
    @keyframes blink { 0%, 48% { opacity: 1; } 52%, 96% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.15s steps(1) infinite; }
    .dot { animation: pulse 2.6s ease-in-out infinite; }
    /* `.in` elements are visible by default and merely fade in, so every
       asset stays complete and readable when animation is unavailable. */
    .in { animation: fin .55s ease-out both; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="1000" height="252" rx="10" fill="#020604"/>
  <rect width="1000" height="252" rx="10" fill="url(#grid)"/>
  <rect width="1000" height="252" rx="10" fill="url(#scan)"/>
<rect x="24" y="22" width="226" height="118" rx="6" fill="#07110A" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="40" y="52" font-size="21" class="gd b" xml:space="preserve" letter-spacing="1">01</text><text x="82" y="52" font-size="14" class="g b" xml:space="preserve" letter-spacing="1.8">SOLVE</text><line x1="40" y1="64" x2="234" y2="64" stroke="#0B5F27" stroke-width="1" opacity="0.6"/><text x="40" y="84" font-size="11.5" class="t2" xml:space="preserve" textLength="200.1" lengthAdjust="spacing">Understand the actual problem</text><text x="40" y="100" font-size="11.5" class="t2" xml:space="preserve" textLength="186.3" lengthAdjust="spacing">before choosing technology.</text><rect x="266" y="22" width="226" height="118" rx="6" fill="#07110A" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="282" y="52" font-size="21" class="gd b" xml:space="preserve" letter-spacing="1">02</text><text x="324" y="52" font-size="14" class="g b" xml:space="preserve" letter-spacing="1.8">DESIGN</text><line x1="282" y1="64" x2="476" y2="64" stroke="#0B5F27" stroke-width="1" opacity="0.6"/><text x="282" y="84" font-size="11.5" class="t2" xml:space="preserve" textLength="172.5" lengthAdjust="spacing">Treat AI as one part of a</text><text x="282" y="100" font-size="11.5" class="t2" xml:space="preserve" textLength="186.3" lengthAdjust="spacing">complete production system.</text><rect x="508" y="22" width="226" height="118" rx="6" fill="#07110A" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="524" y="52" font-size="21" class="gd b" xml:space="preserve" letter-spacing="1">03</text><text x="566" y="52" font-size="14" class="g b" xml:space="preserve" letter-spacing="1.8">MEASURE</text><line x1="524" y1="64" x2="718" y2="64" stroke="#0B5F27" stroke-width="1" opacity="0.6"/><text x="524" y="84" font-size="11.5" class="t2" xml:space="preserve" textLength="172.5" lengthAdjust="spacing">Measure quality, latency,</text><text x="524" y="100" font-size="11.5" class="t2" xml:space="preserve" textLength="207" lengthAdjust="spacing">reliability, security, impact.</text><rect x="750" y="22" width="226" height="118" rx="6" fill="#07110A" stroke="#0B5F27" stroke-width="1" opacity="1"/><text x="766" y="52" font-size="21" class="gd b" xml:space="preserve" letter-spacing="1">04</text><text x="808" y="52" font-size="14" class="g b" xml:space="preserve" letter-spacing="1.8">IMPROVE</text><line x1="766" y1="64" x2="960" y2="64" stroke="#0B5F27" stroke-width="1" opacity="0.6"/><text x="766" y="84" font-size="11.5" class="t2" xml:space="preserve" textLength="186.3" lengthAdjust="spacing">Feed production signal back</text><text x="766" y="100" font-size="11.5" class="t2" xml:space="preserve" textLength="207" lengthAdjust="spacing">into the system, continuously.</text><rect x="24" y="158" width="952" height="70" rx="6" fill="#050B07" stroke="#0B5F27" stroke-width="1" opacity="1"/><rect x="24" y="158" width="3" height="70" fill="#00FF41" opacity="0.8"/><text x="48" y="188" font-size="13.5" class="t" xml:space="preserve" textLength="712.8" lengthAdjust="spacing">AI becomes valuable when it moves beyond a model response and becomes part of a reliable</text><text x="48" y="210" font-size="13.5" class="t" xml:space="preserve" textLength="299.7" lengthAdjust="spacing">product, workflow or decision system.</text></svg>
